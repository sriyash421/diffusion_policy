[pytest]
# This project's tests are unit_tests/. The sibling tests/ directory is vendored upstream --
# realsense, robomimic, mello, block_pushing -- and every file there fails on an import or on
# hardware, so a bare `pytest` from the repo root used to collect 13 guaranteed errors. Left on
# disk deliberately; just not collected.
testpaths = unit_tests

# Registered so `@pytest.mark.slow` is not an unknown-marker warning. Only the SAC suite uses
# it, for the two tests that need a real (if short) training run:
#     pytest unit_tests/test_sac.py -m "not slow"     the default, ~4 minutes
#     pytest unit_tests/test_sac.py                   including them
markers =
    slow: needs a short training run; deselect with -m "not slow"
