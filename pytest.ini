[pytest]
# Registered so `@pytest.mark.slow` is not an unknown-marker warning. Only the SAC suite uses
# it, for the two tests that need a real (if short) training run:
#     pytest unit_tests/test_sac.py -m "not slow"     the default, ~4 minutes
#     pytest unit_tests/test_sac.py                   including them
markers =
    slow: needs a short training run; deselect with -m "not slow"
