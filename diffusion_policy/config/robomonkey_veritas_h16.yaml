defaults:
  - robomonkey_eggplant_search_veritas_outer_inner
  - _self_

horizon: 16
n_action_steps: 8
policy:
  corrupt_obs: false
  corrupt_obs_eval: true
  obs_noise_level: 0.0
  obs_noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 1000
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: linear
    prediction_type: epsilon
  slot_weights:
    mode: uniform
  slot_obs_noise:
    mode: uniform
training:
  max_gradient_steps: 50000
  lr_scheduler: decay_then_constant
  lr_scheduler_kwargs:
    decay_steps: 39500
    min_lr_ratio: 0.1
  outer_batch_size: 256
  inner_batch_size: 256
  inner_epochs: 1
  rollout_every_steps: 100000000
  use_ema: true
  checkpoint_every: 1000
  seed: 42
