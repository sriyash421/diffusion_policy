# SEARCH TRANSFORMER AT WIDTH 1, 100 demos. Half of the 2x2 against the diffusion-UNet BC.
#
# `policy.max_actions: 1` sets the transformer's `max_context_actions` to max_actions-1 = 0,
# so the conditioning sequence is just the n_obs_steps observation tokens and there is ONE
# candidate slot with an empty context. `cond_pos_emb` is (1, 2, 256) here against
# (1, 17, 256) in the width-16 arms; every other parameter tensor is identical. This is
# literally slot 0 of the search transformer, trained on its own.
#
# WHAT IT IS BEING COMPARED TO. `train_pusht_unet_bc` -- a diffusion UNET (DDPM,
# DiffusionUnetImagePolicy), a genuinely different architecture, on the identical episodes
# with the identical LR schedule. So the 2x2 is {transformer, unet} x {29, 100} demos and
# the contrast is architecture, not search width (which is 1 everywhere here).
#
# OFFLINE TRAINER, BECAUSE OUTER/INNER DOES NOT APPLY AT WIDTH 1 -- verified, not assumed.
# `generate_search_context` asks `search_candidates` for `max_actions - 1 = 0` candidates,
# whose loop body never executes, so it returns `(None, None)`. TrainSearchOuterInnerWorkspace
# then tries to `torch.cat` those into a context buffer and dies. The workspace now asserts
# `max_actions > 1` up front and points here rather than failing on a bare NoneType.
#
# That is the right outcome, not a limitation to work around: outer/inner exists to amortize
# the cost of generating `max_actions - 1` candidates per gradient step, and at width 1 that
# cost is zero. Forcing it through would buy nothing on the objective (the loss is
# bit-identical) while making data ordering strictly worse -- a resampled 256-window pool
# with 4 passes, instead of full-dataset epochs.
#
# So the width-1 arms differ from the width-16 arm (`value (oi)`) in trainer as well as in
# search width. Unavoidable, and it costs nothing: the two trainers compute the same loss.
#
# LR: 100k steps, 3k warmup, cosine decay from 1e-4 to a 1e-5 FLOOR reached at step 80,000,
# then held constant. `decay_then_constant` with decay_steps 77000 -- NOT the inherited
# decay_steps 10000, which is calibrated for the 20k search runs and would hit the floor by
# 13k and sit there for 87% of the run. That defect is recorded in
# data/outputs/_discarded/bc_demos-29-r8_seed-42__BAD-lr-decay_steps-10000/WHY_DISCARDED.md.
#
# DENOISER CAPACITY, RAISED 2026-08-14 AND NOW THE DEFAULT. n_layer 4 -> 6, n_head 4 -> 8,
# n_emb 256 -> 1024, p_drop_attn 0.2 -> 0.1. Measured at this task's obs_feature_dim 530 /
# horizon 16 / action_dim 2:
#
#            denoiser   decoder   cond enc   whole policy   ckpt      vs UNet
#   was         5.94M     4.21M      1.58M       17.12M     0.27 GB    0.021x
#   NOW       126.58M   100.78M     25.19M      137.75M     2.20 GB    0.449x
#   UNet BC   282.18M       --         --       293.36M     4.40 GB    1.000x
#
# WHY. At 100 demos the UNet BC arm reached 62% success against this architecture's 28%, and
# the gap OPENED with data (at 29 demos they converge, 20% vs 18%). This arm had the BEST
# held-out denoising loss of all four 2x2 arms and lost badly on the task, so it was neither
# failing to learn the objective nor undertrained. train_pusht_st_n1_drop001 tests the
# regularization explanation; this tests the other one its header names as the fallback,
# "capacity and conditioning bandwidth (5.94M vs 278.10M denoiser ...)".
#
# Transformer parameters go as n_layer x 16 d^2 plus n_cond_layers x 12 d^2, so DEPTH IS
# LINEAR AND WIDTH IS QUADRATIC: 4 -> 6 layers alone is 1.35x (8.06M); 256 -> 1024 is what
# buys the 21x. The ResNet18 obs encoder is untouched at 11.18M.
#
# HEAD DIM CHANGES, 64 -> 128 (1024/8, where it was 256/4). This is therefore not a pure
# widening -- each head attends in a 128-d subspace -- and the LR schedule below transfers
# less cleanly than it would at n_head 16, which would hold head dim at 64 for the same
# width and the SAME parameter count. n_head 16 is the first thing to try if this trains
# badly.
#
# TWO VARIABLES MOVED TOGETHER: p_drop_attn also went 0.2 -> 0.1, on the usual argument that
# a larger model is under-regularized less. That argument is WEAK here -- 126.58M parameters
# against 12,199 training windows -- so if this arm regresses, check the train/val gap
# before concluding anything about capacity. train_pusht_st_n1_drop001 (0.01 dropout at the
# OLD capacity) is the other half of the pair and is what disambiguates.
#
# THE PARENT MOVED TOO, on the same day: `causal_attn: False -> True` and
# `cond_encoder: gpt2`. So a run from here differs from the reported `stn1_demos-100_seed-42`
# numbers in FOUR ways, not one, and no single result attributes among them. See
# ARCH_2x2_PARITY.md.
#
# `_self_` LAST, or the parent overrides everything below it.
defaults:
  - train_pusht_diffusion_search_single
  - _self_

name: train_pusht_st_n1


n_demos: 100
# `ctx-`/`corrupt-` are dropped: neither applies to a policy whose context is always empty.
# `stn1` distinguishes these from the `bc_demos-*` directories, which are a DIFFERENT
# generation (decay_then_constant, offline trainer) that must not be resumed by these.
#
# `gpt2big` MARKS A NEW GENERATION AND MUST NOT BE REVERTED TO PLAIN `stn1_`. Four things
# changed on 2026-08-14 -- capacity, dropout, causal_attn and cond_encoder -- and
# `offline/stn1_demos-100_seed-42` still holds the pre-change run that every number in
# LATEST_SUCCESS_RATES.md is measured on. hydra.run.dir is derived from run_name with
# training.resume: True, so keeping the old name would point this run at that directory:
# n_emb 256 -> 1024 reshapes every tensor and causal_attn adds a `model.mask` key, so it
# would die on load rather than silently continue -- but it would still be writing new
# checkpoints into the directory the reported results came from. The rename is what keeps
# the two generations separable.
#
# `stn1gpt2_demos-100_seed-42` is likewise taken: that is cond_encoder gpt2 + causal_attn at
# the OLD capacity, stopped at step 110000.
run_name: stn1gpt2big_demos-${n_demos}_seed-${training.seed}

policy:
  # THE knob: 1 candidate == empty context.
  max_actions: 1

  # Denoiser capacity -- see the header. n_emb feeds d_model on the decoder stack and on the
  # conditioning trunk (GPT2Config n_embd, since the parent sets cond_encoder: gpt2), plus
  # input_emb / obs_emb / action_value_emb / time_emb / pos_emb / ln_f / head. Nothing
  # OUTSIDE SearchTransformerForDiffusion keys off it, so no other config value moves with it.
  n_layer: 6
  n_head: 8
  n_emb: 1024

  # The second knob -- see "TWO VARIABLES" in the header. Feeds `dropout=` on the decoder
  # stack and, via _build_cond_encoder, GPT-2's resid_pdrop/attn_pdrop. p_drop_emb is 0.0 in
  # the parent, so this is the only dropout in the model.
  p_drop_attn: 0.1

  # 100, NOT the search line's 8. Set for PARITY with train_pusht_unet_bc, whose DDPM
  # sampler runs at its native 100 -- so the 2x2 varies architecture and demo budget with
  # the sampler held equal, instead of confounding them with a 12.5x difference in
  # denoising steps.
  #
  # Free at training time and only at width 1: num_inference_steps drives
  # `conditional_sample`, which the loss never calls. The offline loop pays it because
  # compute_loss generates max_actions-1 candidates per step; here that is 0, so the
  # gradient step is untouched. What it does cost is ROLLOUT and EVAL, both 12.5x slower.
  #
  # CONSEQUENCE, worth stating: this makes the width-1 arms no longer sampler-matched to
  # the width-16 arm (`value (oi)`, at 8). Compare width-1 to width-16 with that in mind.
  # On frozen BC weights the repo measured n=1 success identical at 8/16/32/100
  # (scripts/slurm/diag_bc_n1.sbatch), so the effect is expected to be nil -- but it was
  # measured on this architecture only, not on the UNet.
  num_inference_steps: 100

task:
  env_runner:
    # the runner special-cases 1 and calls predict_action, so no verifier pool is spawned
    n_search_actions: 1

logging:
  # `gpt2big` alongside `st-n1` so the new generation is filterable without losing the arm
  # tag the older runs are grouped by.
  tags: ["${name}", "${task_name}", "${exp_name}", "st-n1", "gpt2big", "demos-${n_demos}"]
