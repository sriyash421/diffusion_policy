# State + conditional-diffusion Learning-to-Search policy scored by the DQC
# Q-function verifier (JAX) with a DISCOUNTED chunk sum, instead of the
# RoboMonkey LLaVA reward model.
#
# Differences vs robomonkey_eggplant_search_tunable_corruption.yaml:
#   - policy.verifier -> diffusion_policy.policy.dqc_verifier.DQCVerifier
#   - chunk-sum scoring baked in: score_executed_chunk=true, score_agg=
#     discounted_sum, discount=0.98 (the DQC checkpoint's own gamma). The
#     verifier scores each of the n_action_steps EXECUTED steps against the
#     current frame and aggregates  sum_t 0.98^t * Q(frame, a_t).
#   - obs_noise_level defaults to 0.0 (the "no-noise" search policy).
#
# Must run in the simpler_env conda env (only env with both JAX + torch).
#
# Train:
#   python diffusion_policy/workspace/train_mlp_image_workspace.py \
#     --config-name=robomonkey_eggplant_search_dqc policy.obs_noise_level=0.0

defaults:
  - _self_
  - task: robomonkey_eggplant_state

name: robomonkey_eggplant_search_dqc_noise${policy.obs_noise_level}
_target_: diffusion_policy.workspace.train_mlp_image_workspace.TrainMLPImageWorkspace
output_dir: null

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: ${eval:'${horizon}//2'}  # 8 executed of the 16 predicted
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: diffusion_policy.policy.search_policy_robomonkey.SearchPolicyRoboMonkeyDiffusion
  shape_meta: ${shape_meta}
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.FlattenObsEncoder
    shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 8

  n_layer: 4
  n_cond_layers: 2
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.2
  causal_attn: False

  # No-noise search policy (override on the command line for a sweep).
  corrupt_obs: True
  obs_noise_level: 0.0

  max_actions: 16

  verifier:
    _target_: diffusion_policy.policy.dqc_verifier.DQCVerifier
    ckpt_dir: /gscratch/robotics/harine/dqc_checkpoint/sd000s_137913.0.20260605_163017
    instruction: "put the eggplant in the basket"
    image_obs_key: agentview_image
    text_emb_file: /mmfs1/home/harine/RoboMonkey/scriptsv2/q_fn_eval/task_emb.npy
    discount: 0.98
    # Discounted chunk sum over the EXECUTED action window (derived from
    # n_obs_steps / n_action_steps at instantiation by the search policy).
    score_executed_chunk: True
    score_agg: discounted_sum
    health_check: True

dataloader:
  batch_size: 256
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 256
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 100
  gradient_accumulate_every: 1
  gradient_clip_norm: 1.0
  use_ema: False
  freeze_encoder: False
  rollout_every: 50
  checkpoint_every: 1000
  val_every: 10
  sample_every: 10
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: robomonkey_l2s
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}", "dqc", "discounted_chunksum"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
