# ST-n1 WITH ATTENTION DROPOUT AT 0.01 INSTEAD OF 0.2. 100 demos, search width 1.
#
# DIAGNOSTIC RUN, NOT A REPORTED ARM. It exists to test one hypothesis about the
# architecture gap; delete it and its outputs once the question is answered. Teardown is at
# the bottom of this file.
#
# ONE VARIABLE. Identical to train_pusht_st_n1 in every other respect -- same 100-demo
# manifest, same encoder, same n_layer/n_head/n_emb, same DDIM sampler at 100 steps, same
# optimizer and LR schedule, same step budget, same eval protocol. Parameter count is
# unchanged at 5.94M (dropout has no parameters) and the observation still reaches the
# denoiser through the same Linear(530 -> 256) into 2 memory tokens, so this isolates
# regularization and nothing else.
#
# WHY. At 100 demos the UNet BC arm reaches 66% success / 0.952 mean reward against this
# architecture's 28% / 0.796, and the gap OPENS with data (at 29 demos the two converge,
# 16% vs 14%). The training curves rule out the obvious reading:
#
#   ST @100    val_loss  0.048 -> 0.038 -> 0.046   success 28% peak
#   UNet @100  val_loss  0.042 -> 0.062 -> 0.107   success 66% peak
#
# The transformer has the BEST held-out denoising loss of all four 2x2 arms and loses badly
# on the task. So it is not failing to learn the objective, and it is not undertrained --
# both arms plateau on success well before 100k.
#
# THE HYPOTHESIS. Epsilon-MSE is minimized by predicting the conditional MEAN of the action
# distribution. PushT is multimodal (the block can be pushed from either side of the T) and
# the mean of two valid pushes is an invalid one. Dropout on an already capacity-limited
# model (5.94M denoiser against the UNet's 278.10M) pushes it further toward that mean:
# better val_loss, worse behaviour. The rollout numbers agree -- ST @100 reaches 0.796
# episode-max but only 0.634 final-step, against the UNet's 0.925 / 0.889, i.e. it
# approaches the goal and drifts off rather than committing.
#
# PREDICTION, stated in advance so the result is falsifiable:
#   * if the hypothesis holds, n=1 success RISES and val_loss gets WORSE. The two moving in
#     OPPOSITE directions is the signature; either alone is weak evidence.
#   * if nothing moves, regularization is not the driver, and what remains is capacity and
#     conditioning bandwidth (5.94M vs 278.10M denoiser; a 2.07x bottleneck on the obs
#     feature and 4 cross-attention read-outs against the UNet's 12 FiLM injections).
#     See ARCH_2x2_PARITY.md, "Not equal, deliberately".
#
# DO NOT SELECT ON val_loss. `checkpoint.topk` monitors it (mode: min) and on these arms it
# is anti-correlated with success -- the UNet's val_loss rose 0.042 -> 0.107 while its
# success climbed to 66%. Pick from bon_search/success_curves.jsonl as SUCCESS_RATES.md
# does; topk exists only to keep low-val_loss weights on disk.
#
# 0.01 is upstream's value for the PushT transformer
# (train_diffusion_transformer_lowdim_pusht_workspace.yaml). The search line's 0.2 is closer
# to the image-hybrid recipe's 0.3 but applied to HALF that recipe's depth (n_layer 4 vs 8),
# which is what makes it worth questioning. Not 0.0: this keeps the comparison at "much less
# dropout" rather than "dropout removed", and 0.01 is a committed upstream setting rather
# than a value invented for this run.
#
# `_self_` LAST, or the parent overrides everything below it.
defaults:
  - train_pusht_st_n1
  - _self_

name: train_pusht_st_n1_drop001

policy:
  # THE knob. Feeds `dropout=` on both the TransformerDecoderLayer stack (n_layer: 4) and the
  # TransformerEncoderLayer memory encoder (n_cond_layers: 2). p_drop_emb is already 0.0 in
  # the parent, so this is the only dropout in the model.
  p_drop_attn: 0.01

  # ------------------------------------------------------------------------------------
  # PINNED TO THE PRE-2026-08-14 ARCHITECTURE. These five keys are not knobs -- they restate
  # what train_pusht_st_n1 used to provide, and they exist because the parent moved on
  # 2026-08-14 (n_emb 256 -> 1024, n_layer 4 -> 6, n_head 4 -> 8, causal_attn False -> True,
  # cond_encoder transformer -> gpt2).
  #
  # Without them this file inherits all four and the diagnostic is void: its header claims
  # "Identical to train_pusht_st_n1 in every other respect" and "Parameter count is unchanged
  # at 5.94M", and it is measured against `stn1_demos-100_seed-42`, which is the OLD
  # architecture. A 126.58M causal GPT-2-conditioned model at 0.01 dropout answers a question
  # nobody asked.
  #
  # Delete this block along with the rest of the file once the hypothesis is settled.
  n_layer: 4
  n_head: 4
  n_emb: 256
  causal_attn: False
  cond_encoder: transformer

# MUST differ from `stn1_demos-100_seed-42`. hydra.run.dir is derived from run_name and
# training.resume is True, so sharing the name would resume the 0.2 run's checkpoints into
# this one -- silently continuing that run under a different config instead of starting a new
# arm. The `drop001` element is also what the teardown below globs on, so keep it distinctive.
run_name: stn1-drop001_demos-${n_demos}_seed-${training.seed}

training:
  # 100k, NOT the parent's 300k. This is a diagnostic, and the question is answered well
  # inside 100k: the baseline ST @100 plateaus on success by ~50-80k (0.735 mean reward at
  # 50k, 0.796 at 90k), and the ST @100 / UNet @100 columns of SUCCESS_RATES.md section 5
  # both stop at 100k -- so this lands on exactly the grid the comparison already uses,
  # at a third the compute. Extend only if the curve is still climbing at 100k.
  #
  # Since 2026-08-12 this is enforced MID-EPOCH, so the run stops on step 100,000 exactly
  # rather than overshooting to the next epoch boundary.
  max_gradient_steps: 100000

  # 10000, NOT the parent's 1000. A checkpoint here is ~261 MB, so at the inherited 1000 this
  # run would write 100 of them (~26 GB) for a question answered off a 10k grid -- every
  # number in SUCCESS_RATES.md section 5 is evaluated at 10k intervals, so denser spacing
  # buys no measurement. At 10000: 10 x 261 MB = 2.6 GB, plus the 5 topk copies and
  # latest.ckpt -- roughly 4.2 GB total.
  #
  # This is the same argument train_pusht_unet_bc.yaml makes for its own 10000 setting,
  # where the checkpoints are 4.4 GB and the two arms together once filled a 1.9 TB disk.
  checkpoint_every: 10000

logging:
  tags: ["${name}", "${task_name}", "${exp_name}", "st-n1", "demos-${n_demos}", "drop001",
         "diagnostic"]

# ---------------------------------------------------------------------------
# TEARDOWN -- run once the hypothesis is settled and the result is recorded.
#
# KEEP first. Everything worth keeping is small; copy it out before deleting anything:
#   RUN=$DP_OUTPUT_ROOT/pusht_search/pusht_image_search/offline/stn1-drop001_demos-100_seed-42
#   mkdir -p analysis/drop001 && cp -r "$RUN"/bon_search "$RUN"/logs.json.txt \
#       "$RUN"/splits.json "$RUN"/run.json analysis/drop001/
#   (bon_search/success_curves.jsonl is the result; logs.json.txt carries the val_loss and
#    sampled-action-MSE curves the prediction above is judged on. Together well under 100 MB.)
#
# THEN DELETE, in order of size:
#   rm -rf "$RUN"/checkpoints        # ~4.2 GB -- the weights, and nothing cites them
#   rm -rf "$RUN"/media "$RUN"/wandb # rollout videos and the local wandb mirror
#   rm -rf "$RUN"                    # or the whole directory once the copy above exists
#   rm diffusion_policy/config/train_pusht_st_n1_drop001.yaml
#
# ALSO: this logs to wandb project pushT_diffusion_search with tag `diagnostic`. Delete the
# run there too, or it sits in the same project as the reported arms and gets mistaken for
# one.
#
# DO NOT add this arm to SUCCESS_RATES.md. scripts/build_success_rates_doc.py globs the
# output tree, so leaving the run dir in place will pull a diagnostic into the reported
# tables on the next rebuild. That is the actual reason to delete rather than archive.
# ---------------------------------------------------------------------------
