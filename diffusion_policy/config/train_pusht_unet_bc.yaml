# PushT UNet BC -- the second master. Scaffolding from pusht_base; this file is the UNet
# policy plus the two keys that differ from the search default (workspace and trainer tag).
defaults:
  - pusht_base
  - _self_

name: train_pusht_unet_bc
_target_: diffusion_policy.workspace.train_diffusion_unet_image_workspace.TrainDiffusionUnetImageWorkspace
n_demos: 100
obs_as_global_cond: True

trainer: unet_bc
run_name: unetbc_demos-${n_demos}_seed-${training.seed}

task:
  env_runner:
    n_search_actions: 1

dataloader:
  num_workers: 4
val_dataloader:
  num_workers: 4

policy:
  _target_: diffusion_policy.policy.diffusion_unet_image_policy.DiffusionUnetImagePolicy
  shape_meta: ${shape_meta}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: True
    prediction_type: epsilon
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      # ImageNet-pretrained conv weights, matching online search and both search arms.
      # Note use_group_norm below swaps every BatchNorm2d for a fresh GroupNorm, so the
      # pretrained normalization statistics are discarded -- the conv filters transfer,
      # the running stats do not.
      weights: IMAGENET1K_V1
    resize_shape: null
    crop_shape: [76, 76]
    random_crop: True
    use_group_norm: True
    share_rgb_model: False
    # MUST stay False: PushTImageDataset.get_normalizer already maps images to [-1,1] via
    # get_image_range_normalizer, while torchvision's ImageNet Normalize expects [0,1].
    # Stacking them gives [-6.50, 2.64] instead of [-2.12, 2.64]. (train_online_search.yaml
    # sets imagenet_norm: True on this same dataset and is miscalibrated for this reason.)
    imagenet_norm: False
  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  # 256, NOT the upstream UNet recipe's 128 -- matched to the search transformer's `n_emb`,
  # which is the width its diffusion-timestep embedding is built at
  # (`self.time_emb = SinusoidalPosEmb(n_emb)`, n_emb 256). This is the closest thing this
  # architecture has to the transformer's embedding size: the UNet has no token projection
  # at all (no `obs_emb`), it flattens the 530-dim obs features for both obs steps to 1060
  # and concatenates the timestep embedding, and that vector is fed to a FiLM `cond_encoder`
  # in every residual block. So raising this widens the conditioning vector 1188 -> 1316 and
  # changes every one of those blocks.
  #
  # ARCHITECTURE-CHANGING: checkpoints written at 128 cannot be loaded at 256. The runs that
  # produced the UNet columns of SUCCESS_RATES.md section 5 used 128 and are archived under
  # data/outputs/_discarded/; anything trained from here on is a different model.
  diffusion_step_embed_dim: 256
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  # flat decay, matching the search arms' training.ema_decay: 0.995 (a ~200-step window).
  # min==max clamps EMAModel's step-dependent warmup curve, which is otherwise a function
  # of an un-checkpointed step counter and so differs across restarts.
  min_value: 0.995
  max_value: 0.995

training:
  # the UNet workspace validates and samples on an epoch cadence, not a step one
  val_every: 1
  sample_every: 5
  rollout_every: null
  # NOT inherited from pusht_base's 1.0: this arm has never clipped, and the workspace does
  # read the key (train_diffusion_unet_image_workspace.py), so inheriting it would silently
  # change UNet BC. The asymmetry vs the ST arm is a documented, deliberate difference.
  gradient_clip_norm: null
  # The remaining pusht_base training.* keys (outer/inner geometry, *_every_steps,
  # nrmse_max_batches, ema_decay) are inert here -- this workspace reads none of them, and
  # EMA is configured by the `ema:` block above.

logging:
  tags: ["${name}", "${task_name}", "${exp_name}", "unet-bc", "demos-${n_demos}"]
