# BC (Behavior Cloning) diffusion UNet for the eggplant task.
#
# Architecture matches the observation space of the search policies
# (robomonkey_eggplant_search_tunable_corruption / noise_conditioned):
#   - same task / dataset  (robomonkey_eggplant_state, success-only)
#   - same state encoder   (FlattenObsEncoder, lowdim-only, 40 dims)
#   - same obs / action window sizes (n_obs_steps=2, horizon=16)
#   - same DDIM schedule with 8 inference steps (fast inference for eval sweeps)
#
# NO verifier at training time. At eval time, N independent samples from this
# policy are scored by the in-process RoboMonkey verifier via BCSearchWrapper
# (see scriptsv2/eval_search/eval_search.py and search_policy_robomonkey.py).
#
# Train:
#   cd /mmfs1/home/harine/RoboMonkey/diffusion_policy
#   python diffusion_policy/workspace/train_diffusion_unet_image_workspace.py \
#       --config-name=robomonkey_eggplant_bc \
#       +training.max_gradient_steps=7000 \
#       task.dataset.use_cache=true \
#       task.dataset.dataset_dir=/gscratch/robotics/harine/data/eggplant_in_basket_complete \
#       training.device=cuda:0

defaults:
  - _self_
  - task: robomonkey_eggplant_state

name: robomonkey_eggplant_bc
_target_: diffusion_policy.workspace.train_diffusion_unet_image_workspace.TrainDiffusionUnetImageWorkspace
output_dir: null

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: ${eval:'${horizon}//2'}  # default: half the horizon
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: diffusion_policy.policy.diffusion_unet_image_policy.DiffusionUnetImagePolicy
  shape_meta: ${shape_meta}
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.FlattenObsEncoder
    shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 8
  obs_as_global_cond: ${obs_as_global_cond}
  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True

dataloader:
  batch_size: 256
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 256
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  # NOTE: this workspace stops on num_epochs, NOT on any gradient-step cap
  # (max_gradient_steps is unused here). Dataset = 77 train steps/epoch, so
  # 260 epochs ~= 20020 gradient steps. We train the full 20k and pick the
  # best-validation checkpoint post-hoc (val_loss is logged every epoch).
  num_epochs: 260
  gradient_accumulate_every: 1
  gradient_clip_norm: 1.0
  use_ema: True
  freeze_encoder: False
  rollout_every: 999999
  # Step-based checkpoint cadence (every 1000 gradient steps -> 20 ckpts over
  # the run, plus latest.ckpt). val_every=1 gives a per-epoch val curve so the
  # post-hoc best-val checkpoint can be located near its minimum.
  checkpoint_every: 1000
  val_every: 1
  sample_every: 10
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: robomonkey_l2s
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}", "bc"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: val_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-val_loss={val_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
