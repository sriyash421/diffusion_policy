# L2S maze, Gaussian family. A: corrupt_obs=False (BoN, Ours); B: corrupt_obs=True (FuzzyBoN)
defaults:
  - _self_
  - task: l2s_maze

name: l2s_maze_search
_target_: diffusion_policy.workspace.train_mlp_image_workspace.TrainMLPImageWorkspace
output_dir: null

# as_is | inner_outer | quadrant (scripts/l2s_maze/maze_layout.py)
maze_split: as_is

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: diffusion_policy.policy.search_policy.SearchPolicy
  shape_meta: ${shape_meta}
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.FlattenObsEncoder
    shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  hidden_dim: 256
  hidden_depth: 4
  corrupt_obs: False
  max_actions: 16
  maze_path: data/l2s_maze/layout/maze.npy
  device: ${training.device}
  verifier_noise: 0.0

dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 100
  gradient_accumulate_every: 1
  gradient_clip_norm: 1.0
  use_ema: False
  freeze_encoder: False
  rollout_every: 50
  checkpoint_every: 1000
  val_every: 5
  sample_every: 5
  max_train_steps: 100
  max_val_steps: null
  max_gradient_steps: 10000
  tqdm_interval_sec: 1.0

logging:
  entity: l2sml
  project: maze_ST_recreate
  resume: True
  mode: online
  name: ${name}_${maze_split}
  tags: ["${name}", "${task_name}", "${exp_name}", "${maze_split}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: val_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-val_loss={val_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/l2s_maze/${maze_split}/${name}
  wandb_name_base: ${name}_${maze_split}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/l2s_maze/${maze_split}/${name}
  sweep:
    dir: data/outputs/l2s_maze/${maze_split}/${name}
    subdir: ${hydra.job.num}
