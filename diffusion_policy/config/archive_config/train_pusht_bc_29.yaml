# BC baseline for the LEGACY 29-demo search arms.
#
# Exists so the six `offline/ctx-*_seed-42/` runs -- the ones with the deep n=128..1024
# curves -- have a no-search baseline on exactly their own data. It therefore uses the
# legacy partition, NOT the Round 7 one:
#
#   test  50 episodes   identical to every other arm (test = perm[:50] is stable)
#   val   10 episodes   the legacy selector (weak: SE ~9.5pp at p=0.9)
#   train 29 episodes   the exact episodes the legacy search runs trained on
#
# The 29 training episodes CANNOT be reproduced with `n_train_episodes: 29`. That takes a
# prefix of the permuted pool, while the legacy runs used `train_ratio: 0.2`, which routes
# through `downsample_mask(..., seed)` -- an independent rng.choice. The two sets overlap in
# only 4 of 29 episodes. The committed manifest reproduces the downsample_mask derivation
# exactly; see scripts/dump_pusht_splits.py and the `derivation` block in the manifest.
#
# Everything else follows the width-1 arm: max_actions 1 (empty context, no verifier), and
# the same encoder / backbone / optimizer / EMA / eval protocol as the search arms.
#
# CAVEAT for the comparison: this run is NOT config-identical to the legacy search arms
# beyond the demo count -- they predate `use_ema: True` and the policy-level `crop_shape`.
# See the "what differs" note in SUCCESS_RATES.md before reading the two side by side.
defaults:
  - train_pusht_diffusion_search
  - _self_

name: train_pusht_bc_29

n_demos: 29

task:
  dataset:
    # explicit, not the `_train${n_demos}` interpolation: this manifest is keyed by the
    # legacy val/train derivation, not by the demo count alone
    split_file: diffusion_policy/config/splits/pusht_seed42_legacy_val10_train29.json
    n_val_episodes: 10
    n_train_episodes: 29
  env_runner:
    n_val_episodes: 10

logging:
  tags: ["${name}", "${task_name}", "${exp_name}", "bc", "demos-${n_demos}", "legacy-split"]

# width 1 -- see above; the old width-1 parent config was deleted 2026-08-18.
n_candidates: 1
