# Noising + Learning-to-Search on the RoboMonkey "put the eggplant in the
# basket" task with RGB observations and the RoboMonkey HTTP verifier.
#
# Before training, start the RoboMonkey verifier server:
#   conda activate monkey-verifier
#   cd /path/to/RoboMonkey/monkey-verifier/src
#   python infer_server.py          # listens on 0.0.0.0:3100
#
# Then launch training:
#   python diffusion_policy/workspace/train_mlp_image_workspace.py \
#       --config-name=robomonkey_eggplant_search_corruption

defaults:
  - _self_
  - task: robomonkey_eggplant

name: robomonkey_eggplant_search_corruption
_target_: diffusion_policy.workspace.train_mlp_image_workspace.TrainMLPImageWorkspace
output_dir: null

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 8
n_obs_steps: 2
n_action_steps: 4
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: diffusion_policy.policy.search_policy.SearchPolicyRGB
  shape_meta: ${shape_meta}

  # RGB obs encoder — ResNet-18 backbone, one copy per camera
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: IMAGENET1K_V1
    resize_shape: null
    crop_shape: null
    random_crop: False
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  hidden_dim: 512
  hidden_depth: 4

  # Noising: corrupt encoded obs features with DDPM noise at training time
  corrupt_obs: True

  # Search width: number of (action, value) candidates the transformer
  # conditions on.  Memory grows as max_actions * (horizon * action_dim + 1).
  max_actions: 16

  # RoboMonkey verifier. Two backends:
  #   server_url: http://127.0.0.1:3100   -> POST to infer_server.py (HTTP).
  #   server_url: in_process              -> load RobotRewardModel locally
  #                                          (no HTTP, no disk image; batches
  #                                          all B rows in one GPU forward).
  # Override on the CLI: `policy.verifier.server_url=in_process`.
  verifier:
    _target_: diffusion_policy.policy.verifiers.RoboMonkeyVerifier
    server_url: http://127.0.0.1:3100
    instruction: "put the eggplant in the basket"
    image_obs_key: agentview_image
    image_save_dir: /tmp/robomonkey_obs
    action_chunk_index: -1          # which step in the chunk to score
    request_timeout: 300
    max_workers: 8
    keep_jpegs: False
    health_check: True

dataloader:
  batch_size: 32
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 32
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 100
  gradient_accumulate_every: 1
  gradient_clip_norm: 1.0
  use_ema: False
  freeze_encoder: False
  rollout_every: 50
  checkpoint_every: 1000
  val_every: 10
  sample_every: 10
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: robomonkey_l2s
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
