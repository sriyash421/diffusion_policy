defaults:
  - _self_
  - task: pusht_image_search

name: train_pusht_diffusion_search
# Paired with `trainer: outer_inner` below -- see the DEFAULT TRAINER block. These two MUST
# move together: `trainer` is only a path component of hydra.run.dir, `_target_` is what
# actually selects the workspace.
_target_: diffusion_policy.workspace.train_search_outer_inner_workspace.TrainSearchOuterInnerWorkspace
output_dir: null

task_name: ${task.name}
shape_meta: ${task.shape_meta}

# ---------------------------------------------------------------------------
# Run identity. These four keys, and nothing else, determine the output directory (see
# hydra.run.dir at the bottom) -- so relaunching the same config RESUMES it instead of
# minting a fresh timestamped dir that `training.resume: True` can never find, and the
# ablation arm is readable straight off the path. A second seed is a new directory rather
# than a silent collision.
#
# The ablation configs override `search_context` / `corrupt_obs` at THIS level; the policy
# block interpolates from here so the two can never disagree.
# ---------------------------------------------------------------------------
exp_name: pusht_search

# ---------------------------------------------------------------------------
# DEFAULT TRAINER -- outer_inner. FLIP APPLIED 2026-08-13.
#
# Outer/inner is now the default way to train offline search, and everything inheriting this
# file gets it. The flip was staged for a long time because SIX r8 trainers were live against
# train_pusht_diffusion_search_29 with Requeue=1: `trainer` is a path component of
#   ${output_root}/${exp_name}/${task_name}/${trainer}/${run_name}
# so flipping it under a running job means any preempt resolves to .../outer_inner/<run>/,
# finds no latest.ckpt, and SILENTLY RESTARTS FROM SCRATCH in a new directory. That is the
# failure AUDIT.md 9.9 documents. The precondition (no live `tr_` jobs) held when this was
# applied -- training now runs locally and nothing was in flight.
#
# WHAT CHANGES. `offline` regenerates the search context from the CURRENT weights on every
# gradient step: max_actions-1 candidate samples plus their verifier rollouts, used once and
# discarded. `outer_inner` generates it once per pool of `outer_batch_size` windows and
# reuses it for `inner_epochs` passes -- ~4x cheaper per update (480 -> 120 verifier sims),
# paid for with a context drawn from weights up to num_inner updates stale. That staleness is
# measured, not assumed: `train_drift_mse_eps` compares the live policy against a frozen
# snapshot of the collector at matched inputs, which is proportional to the per-denoising-step
# KL. Measured at these settings it is ~0.006 and flat across the inner loop.
#
# **Runs trained the two ways are not comparable.** Every run in SUCCESS_RATES.md sections
# 1-3 predates this flip and is `offline`; their directories are under .../offline/ and are
# not resumed by anything launched now.
#
# STILL SINGLE-STEP, deliberately: train_pusht_diffusion_search_single re-pins BOTH
# `trainer: offline` and `_target_`, so train_pusht_bc* inherit the on-policy loop -- BC has
# max_actions=1 and generates no candidates, so there is no search cost to amortize. The
# train_pusht_st_n1* configs re-pin it for the same reason, and MUST: outer/inner asserts
# max_actions > 1, because at width 1 generate_search_context returns (None, None) and there
# is no context to buffer. Anything else that must stay on-policy should inherit
# train_pusht_diffusion_search_single rather than re-pin by hand.
#
# Verify after touching any of this:
#   python train.py --config-name=<cfg> --cfg job --resolve | grep -E 'trainer|_target_'
#   -- and confirm train_pusht_bc* / train_pusht_st_n1* still say offline.
# ---------------------------------------------------------------------------
trainer: outer_inner             # {offline, outer_inner} -- paired with _target_ at the top
search_context: value            # {value, state, state_value, subgoal, subgoal_value}
corrupt_obs: False
# How the executed action is picked. ORTHOGONAL to search_context, which only says what
# each candidate reports back:
#   argmax     -- the verifier scalar ranks the candidates, best one executed (best-of-n
#                 over a ground-truth simulator). Every arm before subgoal-only.
#   final_pass -- after the n candidates are scored, one MORE sample is drawn conditioned
#                 on all of them and executed as-is, unsimulated. The verifier scalar then
#                 takes no part in selection at all.
selection: argmax                # {argmax, softmax, final_pass}
# Geometric decay of the per-candidate-slot LOSS weight, counting BACK from the last slot:
# w_k ∝ decay^(K-1-k), renormalized to mean 1. 1.0 == uniform == the objective every run
# before this key used, bit-identical. See DiffusionTransformerSearchPolicy._slot_weights.
#
# CAVEAT, which is why new arms leave this at 1.0: it keys the weight to the ABSOLUTE slot
# index, but `final_pass` deploys slot min(n, max_actions-1), so the deployed conditional's
# weight depends on the eval n -- at max_actions=16 the slot used at n=1 is trained at 0.45
# and the one at n>=16 at 1.96. Prefer `context_decay` below, which has no n dependence.
slot_weight_decay: 1.0

# Recency discount on the SEARCH CONTEXT, applied inside the transformer as an additive
# attention bias. For a candidate generated against m context entries, the latest entry
# counts at weight 1, the previous at context_decay, the one before that at context_decay^2
# -- entry j gets context_decay^(m-1-j). 1.0 == off.
#
# Unlike slot_weight_decay this depends only on distance-from-latest, never on absolute
# index, on max_actions, or on the search width, so the profile is identical in every loop
# at every n. See SearchTransformerForDiffusion._build_memory_masks.
context_decay: 1.0
# The ablation label for (search_context, selection). Asserted in the workspace against
# _ARM_LABELS so a config cannot file its results under the wrong arm; it is what the run
# directory will be named once the pending rename lands (see AUDIT.md 9.9).
arm: value                       # {value, subgoal-chosen4value, subgoal-value, subgoal-only}
# Training-set size in DEMONSTRATIONS. Selects the split manifest
# (splits/pusht_seed42_train${n_demos}.json) AND appears in the run name, so two budgets
# can never land in the same output directory -- which is how the earlier 29-episode runs
# would otherwise have been silently resumed by a 100-episode relaunch. The budgets nest:
# the 25-episode train set is a strict subset of the 100-episode one, and val/test are
# identical across manifests, so the two are directly comparable.
n_demos: 100
# Search width: how many candidates the loop generates (policy.max_actions interpolates from
# here). Top-level because it is part of the run identity -- the loop length changes both the
# training cost (K-1 candidates are generated per gradient step) and the widest context the
# model is ever trained at, so two K values must not share an output directory.
n_candidates: 16
# RENAME LANDED 2026-08-05 (AUDIT.md 9.9). Keyed on `arm`, not `search_context`, because
# `selection` is a second axis: `subgoal` under argmax is `subgoal-chosen4value`, under
# final_pass it is `subgoal-only` -- different experiments that `ctx-subgoal` conflated.
# The twelve old `ctx-*` directories were moved and back-symlinked, so absolute paths held
# by running jobs still resolve; drop those symlinks once nothing reads through them.
run_name: ${arm}_corrupt-${corrupt_obs}_demos-${n_demos}_seed-${training.seed}

# Run output goes to /gscratch, NOT home. Home is a 10G hard quota and a single 100k-step
# run's checkpoints (policy + AdamW moments + EMA copy, x50 step_*.ckpt) exceed it on their
# own. Putting the whole run dir there -- not just a symlinked checkpoints/ -- means wandb
# files, logs.json.txt and the eval watcher's bon_search/ follow automatically.
# Override per-user with the DP_OUTPUT_ROOT env var.
output_root: ${oc.env:DP_OUTPUT_ROOT,/gscratch/robotics/harine/diffusion_policy_outputs}

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0

policy:
  _target_: diffusion_policy.policy.pusht_diffusion_search_policy.PushTDiffusionSearchPolicy
  shape_meta: ${shape_meta}
  # PushT images (96x96) need a real vision backbone, not FlattenObsEncoder.
  #
  # These five keys are the upstream PushT-image BC recipe and must stay mutually
  # consistent -- an earlier configuration had all three of {pretrained weights, group norm,
  # imagenet_norm} on at once, which do not compose, and no augmentation at all. That run
  # overfit by ~3k steps (val_loss min 0.089 -> 0.29 by 99k) and its success rate decayed to
  # zero. See AUDIT.md "ROUND 4 -- ROOT CAUSE".
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      # random init, NOT IMAGENET1K_V1: use_group_norm below replaces every BatchNorm2d
      # with a freshly-initialized GroupNorm, which discards exactly the normalization
      # statistics pretrained weights depend on. Pick one or the other; upstream PushT BC
      # pairs random init with group norm, and that is the configuration that works here.
      weights: null
    resize_shape: null
    # The CropRandomizer still lives here (so the encoder's declared input shape stays
    # 96x96 and its shape assertion keeps working), but the POLICY chooses the offsets and
    # passes them in -- see crop_shape / random_crop in the policy block below. Left to
    # itself CropRandomizer samples one offset per IMAGE, which cannot express "the
    # observation and the subgoals predicted from it must share a crop".
    crop_shape: [76, 76]
    random_crop: True
    use_group_norm: True
    share_rgb_model: False
    # MUST be False: the LinearNormalizer already maps images to [-1,1]
    # (normalize_util.get_image_range_normalizer), and ImageNet stats assume [0,1]. With
    # both on, the encoder saw roughly [-6.5, +2.25].
    imagenet_norm: False

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 8

  n_layer: 4
  n_cond_layers: 2
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.2
  causal_attn: False
  # interpolated from the top-level identity keys so the run dir and the policy can never
  # disagree about which ablation arm this is
  corrupt_obs: ${corrupt_obs}
  search_context: ${search_context}
  selection: ${selection}
  slot_weight_decay: ${slot_weight_decay}
  context_decay: ${context_decay}

  # Image crop, owned by the POLICY rather than the obs encoder. Random crop is the
  # primary regularizer for PushT image BC (76x76 out of 96x96, matching
  # train_diffusion_unet_hybrid_workspace.yaml) and removing it is what let an earlier run
  # memorize the train set in ~3k steps -- so it stays.
  #
  # What changed is WHERE the offset comes from. One offset is drawn per SAMPLE and reused
  # for that sample's whole obs window AND every subgoal image the search generates from
  # it, so obs and subgoal stay spatially registered at train time exactly as they are at
  # eval time (where both are center-cropped). The offset is a pure function of
  # (training.seed, global_step), so it is identical across restarts and machines and is no
  # longer drawn from the global RNG interleaved with the diffusion noise.
  crop_shape: [76, 76]
  random_crop: True

  # search width (candidates conditioned on the previous ones), same as the maze config.
  # Interpolated from the top-level identity key so the run dir and the policy agree.
  max_actions: ${n_candidates}
  # feedback-based PushT verifier (simulates candidates in a deterministic PushT sim,
  # value = -mean per-keypoint distance to the goal T). No maze_path / MazeVerifier.
  # The pool of verifier_n_envs sims steps in parallel (AsyncVectorEnv) to keep step
  # time tractable. verifier_steps stays null: the policy already hands the verifier
  # exactly the executed action window (action_pred[n_obs_steps-1 : +n_action_steps]),
  # so any cap here could only truncate that window.
  verifier_n_envs: 32
  verifier_legacy: False
  verifier_use_async: True
  verifier_steps: null

dataloader:
  # kept small: the verifier physics-simulates max_actions-1 candidates per step, so
  # step time is dominated by the verifier. Raise if the verifier is parallelized.
  batch_size: 32
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 32
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  # Linear warmup to lr over 3k steps, cosine decay to min_lr_ratio*lr = 1e-5 reached at
  # step 80,000, then HELD constant. decay_steps is measured from the END of warmup
  # (progress = (step - warmup)/decay_steps), so 3000 + 77000 puts the floor at exactly 80k.
  #
  # This is the standard shared with the width-1 arms (train_pusht_st_n1*, train_pusht_unet_bc*)
  # so n=1 and n=16 results are directly comparable. It replaces warmup 500 / decay_steps
  # 10000, which was calibrated for the old 20k runs and left a 100k run at its 1e-5 floor
  # for 89% of training -- the defect recorded in
  # data/outputs/_discarded/bc_demos-29-r8_seed-42__BAD-lr-decay_steps-10000/WHY_DISCARDED.md.
  #
  # `decay_then_constant` is a pure function of the step index, so it is safe to resume and
  # safe to EXTEND: training past 100k just continues at 1e-5. Plain `cosine` is periodic
  # past its horizon (it climbs back to peak), so a resumed run would silently start a
  # second cycle.
  lr_scheduler: decay_then_constant
  lr_warmup_steps: 3000
  lr_scheduler_kwargs:
    decay_steps: 77000
    min_lr_ratio: 0.1
  # SAFETY BOUND ONLY -- max_gradient_steps below is what ends the run, and it is enforced
  # mid-epoch so it stops on the exact step. num_epochs must stay far above any epoch count
  # that could reach the budget: an epoch is ceil(n_windows/batch_size) steps, so at 29 demos
  # it is ~110 steps and the old `num_epochs: 1000` was only ~110k -- close enough to bind
  # first and silently become the real limit. Kept rather than removed because the loop is
  # `range(num_epochs)` and self.epoch feeds the topk format_str.
  num_epochs: 100000
  # 100k. The old 20k cap dates from the pre-augmentation runs that overfit by ~3k steps;
  # with crop augmentation and EMA in place val_loss keeps improving much longer. Matches
  # the width-1 arms, so the two search widths are compared at equal optimization.
  max_gradient_steps: 100000
  gradient_accumulate_every: 1
  gradient_clip_norm: 1.0
  # EMA weights are what gets rolled out, validated, sampled and shipped in the checkpoint;
  # the live weights are only the optimization target.
  use_ema: True
  # Constant, NOT the repo's warmup curve. EMAModel's default decay is a function of the
  # step index (1 - (1+step)^-0.75, capped at max_value), which makes the averaging window
  # depend on where you are in the run -- and its step counter is not checkpointed, so a
  # resumed run re-enters the curve at 0. A flat decay is the same at every step and
  # identical across restarts. 1/(1-0.995) = a 200-step averaging window throughout.
  # Override to 0.999 for a 1000-step window if this smooths too little.
  ema_decay: 0.995
  freeze_encoder: False

  # ---- outer/inner loop geometry (TrainSearchOuterInnerWorkspace) ----
  # THE knob is max_gradient_steps above; these four define the loop shape and are
  # independent of run length. num_inner = inner_epochs * ceil(outer_bs/inner_bs) = 32
  # updates per outer step, so the search cost per update is divided by exactly
  # inner_epochs (4x here: 480 -> 120 verifier sims). There is deliberately no num_outer --
  # the outer loop runs until the gradient-step budget is spent.
  outer_batch_size: 256    # windows whose search context is generated per outer step
  inner_batch_size: 32     # matches dataloader.batch_size
  inner_epochs: 4          # 256/32 = 8 batches/epoch x 4 = 32 updates per outer step
  drift_every: 4           # inner steps between drift evaluations (2 extra forwards each)
  # Rollout on GRADIENT STEPS and on a multiple of checkpoint_every, so every rollout
  # number belongs to weights that were saved and can be re-verified against an eval curve.
  # rollout_every (epochs) is kept only as the fallback for configs that predate this.
  # ALL eval cadences are in GRADIENT STEPS. An epoch is not a stable unit here: its length
  # depends on the dataset size and the train budget, so the old `val_every: 10` fired every
  # ~960 steps at a 25-episode budget and would fire every ~4030 at 100 episodes -- the same
  # config value silently meaning 4x less validation. rollout_every_steps is additionally a
  # multiple of checkpoint_every, so every in-training success number belongs to weights that
  # were saved and can be re-verified against an eval curve.
  # The *_every (epoch) keys below are retained only as the fallback for configs predating
  # this; the workspace prefers the *_every_steps ones whenever they are set.
  # MUST be a multiple of checkpoint_every, so every in-training success number belongs to
  # weights that were saved and can be re-verified against an eval curve. It was 2000 when
  # checkpoint_every was 1000; at the 10k cadence that would put rollouts on steps with no
  # checkpoint behind them. 20000 -> 5 rollouts over a 100k run.
  rollout_every_steps: 20000
  val_every_steps: 1000
  sample_every_steps: 1000
  rollout_every: 50
  # 10k, matching the eval grid: every checkpoint written gets scored and nothing is scored
  # off-grid. At the old 1k cadence a 100k run wrote 100 checkpoints of which ~10 were ever
  # evaluated; on the 4.4 GB UNet checkpoints that same cadence filled a 1.9 TB disk at step
  # 115k. A search-policy checkpoint is ~261 MB, so 10 x 261 MB per 100k run.
  checkpoint_every: 10000
  val_every: 10
  sample_every: 10
  # Bound the (verifier-driven) normalized-RMSE eval. These batches are now drawn as a
  # FIXED SEEDED SUBSET spanning the whole split (see _make_nrmse_loader): with the plain
  # shuffle:False loader all 128 windows came from the split's first episode, so every
  # val_*/test_* number was a single-episode statistic.
  nrmse_max_batches: 4
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  entity: l2sml
  project: pushT_diffusion_search
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  # Keep the k best-by-val_loss checkpoints. This is a SAFETY NET, not the final selector:
  # the previous run's val_loss bottomed at step ~3k and then rose 3x while training
  # continued to 100k, and because nothing tracked it the good model was overwritten and
  # every evaluated checkpoint came from the overfit regime.
  #
  # Any checkpoint choice should come from real eval, not from val_loss -- eval_search_pusht.py
  # --watch evaluates each checkpoints/step_*.ckpt into bon_search/success_curves.jsonl, and
  # you pick from that curve. topk just guarantees the low-val_loss weights still exist by the
  # time that runs.
  topk:
    monitor_key: val_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-val_loss={val_loss:.4f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

hydra:
  # Run dir is a pure function of the run IDENTITY, not of the wall clock. Consequences:
  #   * relaunching the same config resumes it (training.resume finds latest.ckpt) --
  #     with a timestamped dir it silently restarted from scratch every time;
  #   * the ablation arm and seed are readable from the path, so reporting is a glob
  #     instead of three hand-maintained arm->path tables that drift apart;
  #   * a different seed is a different directory instead of overwriting the first run.
  # Do NOT pass hydra.run.dir= on the command line; that was the workaround for the
  # timestamped template and it reintroduces silent collisions between arms.
  run:
    dir: ${output_root}/${exp_name}/${task_name}/${trainer}/${run_name}
  sweep:
    dir: ${output_root}/${exp_name}/${task_name}/${trainer}/_sweep_${now:%Y.%m.%d-%H.%M.%S}
    subdir: ${hydra.job.num}
