defaults:
  - _self_
  - task: pusht_image_search

name: train_pusht_diffusion_search
_target_: diffusion_policy.workspace.train_mlp_image_workspace.TrainMLPImageWorkspace
output_dir: null

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0

policy:
  _target_: diffusion_policy.policy.pusht_diffusion_search_policy.PushTDiffusionSearchPolicy
  shape_meta: ${shape_meta}
  # PushT images (96x96) need a real vision backbone, not FlattenObsEncoder.
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: IMAGENET1K_V1
    resize_shape: null
    crop_shape: null
    random_crop: False
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 8

  n_layer: 4
  n_cond_layers: 2
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.2
  causal_attn: False
  corrupt_obs: False

  # search width (candidates conditioned on the previous ones), same as the maze config.
  max_actions: 16
  # feedback-based PushT verifier (simulates candidates in a deterministic PushT sim,
  # value = -mean per-keypoint distance to the goal T). No maze_path / MazeVerifier.
  # The pool of verifier_n_envs sims steps in parallel (AsyncVectorEnv) to keep step
  # time tractable. verifier_steps stays null: the policy already hands the verifier
  # exactly the executed action window (action_pred[n_obs_steps-1 : +n_action_steps]),
  # so any cap here could only truncate that window.
  verifier_n_envs: 32
  verifier_legacy: False
  verifier_use_async: True
  verifier_steps: null

dataloader:
  # kept small: the verifier physics-simulates max_actions-1 candidates per step, so
  # step time is dominated by the verifier. Raise if the verifier is parallelized.
  batch_size: 32
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 32
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  # decay lr over the first 10k steps, then hold constant at min_lr_ratio * lr.
  lr_scheduler: decay_then_constant
  lr_warmup_steps: 500
  lr_scheduler_kwargs:
    decay_steps: 10000
    min_lr_ratio: 0.1
  num_epochs: 1000
  gradient_accumulate_every: 1
  gradient_clip_norm: 1.0
  use_ema: False
  freeze_encoder: False
  rollout_every: 50
  # persist a checkpoint every 2k gradient steps (consumed by eval_search_pusht --watch).
  # At ~108 steps/epoch, 10k would be ~92 epochs between checkpoints -- the watcher, and
  # so best.json, would have almost nothing to select from for most of a run.
  checkpoint_every: 2000
  val_every: 10
  sample_every: 10
  # bound the (verifier-driven) normalized-RMSE eval to a few batches per split
  nrmse_max_batches: 4
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  entity: l2sml
  project: pushT_diffusion_search
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  # No topk/best checkpoint: TrainMLPImageWorkspace does not instantiate a
  # TopKCheckpointManager, and val loss / val_nrmse do not identify the best task policy
  # anyway. Selection is done from real eval -- eval_search_pusht.py --watch evaluates
  # each checkpoints/step_*.ckpt and maintains bon_search/success_curves.jsonl plus
  # bon_search/best.json, which names the current winner.
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
