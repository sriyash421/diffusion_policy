# Search-context ablation (2/2): SUBGOAL OBSERVATION + VERIFIER SCALAR.
#
# Identical to train_pusht_diffusion_search except for what each already-generated
# candidate feeds back into the context the next candidate is conditioned on:
#   baseline : the verifier scalar (-mean keypoint distance to the goal T)
#   this run : that scalar CONCATENATED with the encoded observation the candidate's
#              action chunk actually reaches when rolled out in the PushT sim (the
#              rendered frame plus agent_pos/feedback, through this policy's own obs
#              encoder) -- i.e. both signals.
# Both come out of the same simulated rollout, so this costs no extra sim steps over the
# baseline. Candidate ranking still uses the verifier scalar.
#
# 100k gradient steps, checkpointing every 10k (consumed by eval_search_pusht.py --watch),
# same rollout / nrmse evaluation cadence as the baseline.
defaults:
  - train_pusht_diffusion_search
  - _self_

name: train_pusht_diffusion_search_subgoal_verifier

policy:
  search_context: subgoal_value

training:
  # hard stop at 100k gradient steps; num_epochs is just an upper bound so the epoch
  # loop never runs out first (the check is at the epoch boundary).
  max_gradient_steps: 100000
  num_epochs: 100000

logging:
  tags: ["${name}", "${task_name}", "${exp_name}", "subgoal_verifier_env"]
