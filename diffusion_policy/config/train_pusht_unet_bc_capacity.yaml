# Capacity ablation: preserve the BC recipe and change only denoiser channels.
defaults:
  - train_pusht_unet_bc
  - _self_

name: train_pusht_unet_bc_capacity
capacity_suffix: _capacity-u${policy.down_dims.0}x${policy.down_dims.1}x${policy.down_dims.2}
run_name: unetbc_ver-${verifier_tag}${gm_suffix}${enc_suffix}${capacity_suffix}_demos-${n_demos}${split_suffix}_seed-${training.seed}
policy:
  down_dims: [128, 256, 512]
