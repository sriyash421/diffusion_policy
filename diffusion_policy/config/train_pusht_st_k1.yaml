# BEHAVIOUR-CLONING BASELINE for the PushT diffusion-search arms.
#
# The whole point of a baseline is that it differs in ONE thing, so this does not introduce
# a separate BC policy class. It reuses PushTDiffusionSearchPolicy with `max_actions: 1`,
# which sets the transformer's `max_context_actions` to 0: every candidate is drawn with an
# EMPTY search context. Consequences, all verified by scripts/bc_smoke.py:
#
#   training : plain denoising BC on the expert action. No candidates are generated, so
#              the verifier's worker pool is never even spawned -- a BC step costs one
#              forward/backward instead of 15 DDIM samples + 15 physics rollouts.
#   n=1 eval : an ordinary BC rollout (the env runner calls predict_action directly).
#   n>1 eval : best-of-n over i.i.d. samples. This is the comparison that matters -- it
#              gives BC the SAME test-time search budget as the search arms, so any
#              remaining gap is attributable to the learned search context rather than to
#              simply drawing more samples and keeping the best.
#
# Everything else -- encoder recipe, transformer size, normalizer, optimizer, LR schedule,
# split manifest, trainer, checkpoint cadence and eval harness -- is inherited unchanged
# from train_pusht_diffusion_search. Do not override them here.
#
# ---------------------------------------------------------------------------
# PARITY POLICY. This is the baseline the search method is measured against, so it must be
# neither gratuitously different nor artificially handicapped.
#
# SHARED, and must stay shared -- these define the experiment, so a difference here would
# confound the one variable under test:
#   data (split manifest, n_demos, val/test episodes), architecture (n_layer/n_head/n_emb/
#   dropout/causal_attn), obs encoder, horizon / n_obs_steps / n_action_steps, noise
#   scheduler, optimizer + LR schedule, EMA (use_ema/ema_decay), batch size, and the whole
#   eval protocol -- same episodes, same seeds, same success threshold.
#
# num_inference_steps STAYS SHARED AT 8. It is 8 for search because a search training step
# samples max_actions-1 candidates and 100 steps would be 12.5x the dominant cost; BC
# samples nothing during training, so inheriting 8 looked like a free handicap. Measured on
# frozen BC weights, it is not one: n=1 success was identical (0%) at 8, 16, 32 AND 100
# inference steps on two checkpoints. See scripts/slurm/diag_bc_n1.sbatch. Sampler quality is not
# what limits this policy, so parity costs BC nothing.
#
# ALLOWED TO DIFFER -- training length, and only this:
#   Equal gradient steps is NOT the neutral choice. At 20k, BC's val_loss is still falling
#   (undertrained ~60x against upstream's 3050 epochs) while every search arm has already
#   peaked -- the six legacy arms select best at steps 1000-8000 of 20000 and decline after.
#   Holding both at one budget would starve the baseline and flatter the method. So each is
#   trained to its own optimum and the checkpoint is chosen on VAL for both, which keeps
#   test honest. The compute asymmetry is real and must be reported: a BC step is ~100x
#   cheaper than a search step, so equal wall-clock gives BC far more steps.
# ---------------------------------------------------------------------------
#
# search_context is inert at max_actions=1 (there is no context to populate) and is left at
# the base value only so the policy's kwargs validation passes.
# Inherits _single, NOT the base. The base is switching its default to the outer/inner
# loop; BC must not follow it there. With max_actions=1 the context is always empty and no
# candidates are generated, so there is no search cost to amortize -- outer/inner would
# spin up a context-generation pool BC never reads from, and would change the baseline
# every search number is measured against for no reason. Resolves identically today.
defaults:
  - train_pusht_diffusion_search_single
  - _self_

name: train_pusht_bc

# Run identity. `ctx-`/`corrupt-` are dropped from the name because neither applies to a
# policy with no search context; the budget stays, since that is the variable under test.
run_name: bc_demos-${n_demos}_seed-${training.seed}

policy:
  # THE knob: 1 candidate == empty context == BC.
  max_actions: 1

training:
  # Effectively unbounded, so `max_gradient_steps` is the ONLY thing that ends a run.
  # An epoch is not a stable unit here -- its length is the train-set size -- so the
  # inherited `num_epochs: 1000` meant different step budgets per demo budget: 99 batches
  # per epoch at 25 demos capped that arm at 99,000 steps, while 382 batches per epoch at
  # 100 demos would not bind until 382,000. The two BC arms would then have differed in
  # training length for a reason unrelated to the variable under test. Bound the run with
  # max_gradient_steps and nothing else.
  num_epochs: 100000

task:
  env_runner:
    # in-training rollouts execute a single sample, i.e. BC. The runner special-cases 1 and
    # calls predict_action, so no verifier rollout is paid for a candidate set of size one.
    n_search_actions: 1

logging:
  tags: ["${name}", "${task_name}", "${exp_name}", "bc", "demos-${n_demos}"]
