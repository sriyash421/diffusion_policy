# State + TRANSFORMER/GAUSSIAN Learning-to-Search policy scored by the DQC CHUNK
# Q-function verifier (real BridgeDQCChunkAgent). Gaussian counterpart of
# robomonkey_eggplant_search_dqc.yaml (which is the conditional-diffusion variant).
#
#   - policy -> SearchPolicyRoboMonkey (Normal/Gaussian per token), NOT diffusion.
#   - Predict an 8-action chunk from the CURRENT frame (n_obs_steps=1), execute
#     the first 4 (receding horizon). The DQC chunk critic scores ALL 8 predicted
#     actions (= the chunk a_{t:t+8}) in one forward, so horizon == backup_horizon=8.
#   - critic_type=chunk, score_full_horizon=True (the 8 predicted ARE the chunk).
#
# Run in the `dqc` conda env (torch + jax0.4.x/flax0.8.x for the real verifier).
# Train:
#   python diffusion_policy/workspace/train_mlp_image_workspace.py \
#     --config-name=robomonkey_eggplant_search_dqc_gaussian

defaults:
  - _self_
  - task: robomonkey_eggplant_state

name: robomonkey_eggplant_search_dqc_gaussian_noise${policy.obs_noise_level}
_target_: diffusion_policy.workspace.train_mlp_image_workspace.TrainMLPImageWorkspace
output_dir: null

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

# horizon 8 == DQC chunk backup_horizon; rollout 4 of the 8 predicted.
horizon: 8
n_obs_steps: 1
n_action_steps: 4
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: diffusion_policy.policy.search_policy_robomonkey.SearchPolicyRoboMonkey
  shape_meta: ${shape_meta}
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.FlattenObsEncoder
    shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  hidden_dim: 256
  hidden_depth: 4

  # No-noise search policy (override on the command line for a sweep).
  corrupt_obs: True
  obs_noise_level: 0.0

  max_actions: 16

  verifier:
    # REAL BridgeDQCChunkAgent (flax) loaded in-process; run in the `dqc` conda env.
    _target_: diffusion_policy.policy.dqc_verifier.DQCVerifier
    ckpt_dir: /gscratch/robotics/harine/dqc_checkpoint/sd000s_137913.0.20260605_163017
    instruction: "put the eggplant in the basket"
    image_obs_key: agentview_image
    # Precomputed multilingual USE-3 embedding (matches the model's text processor).
    # (If this path is missing the verifier falls back to the repo's copy.)
    text_emb_file: /mmfs1/home/harine/RoboMonkey/scriptsv2/q_fn_eval/task_emb_use3.npy
    # 8-step DQC chunk_critic: one Q over the whole predicted chunk.
    critic_type: chunk
    q_agg: min
    # The policy predicts exactly backup_horizon=8 actions from the current frame,
    # so all 8 ARE the chunk a_{t:t+8} (NOT the 4 executed actions).
    score_full_horizon: True
    score_executed_chunk: False
    health_check: True

dataloader:
  batch_size: 256
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 256
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 100
  gradient_accumulate_every: 1
  gradient_clip_norm: 1.0
  use_ema: False
  freeze_encoder: False
  rollout_every: 50
  checkpoint_every: 1000
  val_every: 10
  sample_every: 10
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: robomonkey_l2s
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}", "dqc", "chunk_critic", "gaussian"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
