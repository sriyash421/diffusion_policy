# State + conditional-diffusion Learning-to-Search policy with the obs-noise
# level fed in as a *conditioning input* (tmrl ContextSmoothedFlowPolicy style).
#
# Difference vs robomonkey_eggplant_search_tunable_corruption.yaml:
#   tunable_corruption:    one fixed noise level baked into the checkpoint at
#                          training time (or random per-batch). Model never
#                          sees how much noise it got.
#   noise_conditioned:     per-sample tcont_context ~ U[0,1] at training, AND
#                          a sinusoidal embedding of the DDPM timestep is added
#                          to each obs token before the diffusion transformer.
#                          One checkpoint covers all noise levels. At eval the
#                          caller chooses tcont_context (defaults to 0 = clean).
#
# Launch:
#   python diffusion_policy/workspace/train_mlp_image_workspace.py \
#       --config-name=robomonkey_eggplant_search_noise_conditioned

defaults:
  - _self_
  - task: robomonkey_eggplant_state

name: robomonkey_eggplant_search_noise_conditioned
_target_: diffusion_policy.workspace.train_mlp_image_workspace.TrainMLPImageWorkspace
output_dir: null

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: diffusion_policy.policy.search_policy_robomonkey.SearchPolicyRoboMonkeyDiffusionNoiseCond
  shape_meta: ${shape_meta}
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.FlattenObsEncoder
    shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 8

  n_layer: 4
  n_cond_layers: 2
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.2
  causal_attn: False

  # Embedding width for the noise-level sinusoidal conditioning.
  tcont_emb_dim: 128

  max_actions: 16

  verifier:
    _target_: diffusion_policy.policy.verifiers.RoboMonkeyVerifier
    server_url: in_process
    instruction: "put the eggplant in the basket"
    image_obs_key: agentview_image
    image_save_dir: /tmp/robomonkey_obs
    action_chunk_index: -1
    request_timeout: 300
    max_workers: 8
    keep_jpegs: False
    health_check: True

dataloader:
  batch_size: 256
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 256
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 100
  gradient_accumulate_every: 1
  gradient_clip_norm: 1.0
  use_ema: False
  freeze_encoder: False
  rollout_every: 50
  checkpoint_every: 1000
  val_every: 10
  sample_every: 10
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: robomonkey_l2s
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}", "noise_conditioned"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
