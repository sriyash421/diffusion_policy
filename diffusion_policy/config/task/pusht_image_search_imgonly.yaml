name: pusht_image_search_imgonly

# IMAGE-ONLY OBSERVATION. Identical to pusht_image_search except that `agent_pos` and
# `feedback` are out of shape_meta, so obs_feature_dim is 512 (pure ResNet) rather than 530.
#
# WHY, and it is not a cleanup: this task exists for the per-slot corruption ladder
# (policy.slot_obs_noise). With agent_pos and feedback in the observation they arrive
# NORMALIZED and would be corrupted at a wholly different SNR from the unnormalized ResNet
# block -- and, worse, the ladder could not bite at all, because slot 0 would still know its
# own position and the goal-relative error exactly. Those 18 dims are most of the
# task-relevant state; leaving them clean makes "slot 0 is uncertain" false.
#
# A SEPARATE FILE, not an edit to pusht_image_search: this changes the policy's input, so
# runs against the two are not comparable and must not share a task name.
#
# The dataset still EMITS agent_pos and feedback and the normalizer still fits them; keys
# absent from shape_meta are simply not picked up by MultiImageObsEncoder, which builds its
# key lists from shape_meta. The verifier (pusht_verifier.py) and env runner
# (pusht_search_image_runner.py) read feedback off the raw env obs, not the encoded vector,
# so both are unaffected.
image_shape: &image_shape [3, 96, 96]
shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  # block_pos is emitted by the dataset (reset-only) but deliberately kept out of
  # shape_meta so the encoder never sees it. agent_pos and feedback are ALSO withheld here
  # -- see the header.
  obs:
    image:
      shape: *image_shape
      type: rgb
  action:
    shape: [2]

env_runner:
  _target_: diffusion_policy.env_runner.pusht_search_image_runner.PushTSearchImageRunner
  # rollouts reset to the initial states of the held-out val + test episodes.
  # zarr_path/seed/n_test_episodes/n_val_episodes must match task.dataset so the split matches.
  zarr_path: ${task.dataset.zarr_path}
  seed: ${task.dataset.seed}
  n_test_episodes: ${task.dataset.n_test_episodes}
  n_val_episodes: ${task.dataset.n_val_episodes}
  n_train_episodes: ${task.dataset.n_train_episodes}
  # the SAME manifest the dataset reads, so the rollout splits cannot drift from the
  # training splits (both used to re-derive from the seed independently)
  split_file: ${task.dataset.split_file}
  # first 5 episodes per split are tiled into a side-by-side eval video
  n_vis: 5
  # candidates generated per decision at eval time (best-value one is executed). Kept
  # modest so periodic in-training rollout stays affordable (verifier is physics-simulated).
  n_search_actions: ${n_candidates}
  # must be False to reset exactly onto recorded states (see runner)
  legacy: False
  max_steps: 300
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  past_action: ${past_action_visible}
  n_envs: null

dataset:
  _target_: diffusion_policy.dataset.pusht_image_dataset.PushTImageDataset
  zarr_path: data/pusht_cchi_v7_replay.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  # ---------------------------------------------------------------------------
  # THE SPLIT MANIFEST IS THE SOURCE OF TRUTH. It names the exact episode indices;
  # the four count keys below are VALIDATED against it and generate nothing. A config
  # that disagrees with the manifest raises rather than silently repartitioning.
  #
  # This exists because the splits used to be derived at runtime, independently, in the
  # dataset, the env runner and the eval script, from (seed, n_test, n_val, n_train,
  # train_ratio). Nothing recorded which episodes a checkpoint had been trained on -- so
  # when n_val_episodes went 10 -> 30 to fix the checkpoint selector, train_ratio: 0.2 of
  # a shrinking pool silently cut the training budget from 29 episodes to 25, and every
  # result collected in between was on a different dataset than the one before it.
  #
  # Regenerate with:  python scripts/dump_pusht_splits.py
  # Check it still matches the derivation / the zarr:  --verify / --check-zarr
  # ---------------------------------------------------------------------------
  # selected by the top-level n_demos, so the budget, the manifest and the run directory
  # can never disagree (see train_pusht_diffusion_search.yaml)
  split_file: diffusion_policy/config/splits/pusht_seed42_train${n_demos}.json
  # 206 episodes: 50 test / 30 val / 100 train (26 unused). test = perm[:50] is
  # byte-identical to the legacy 2-way split for this seed, so previously-collected test
  # numbers stay measured on the same episodes.
  n_test_episodes: 50
  # the val split is what a checkpoint should be CHOSEN on, so that test stays a report
  # rather than a maximum; at 10 episodes its SE was ~9.5pp at p=0.9, which made three arms
  # tie at 9/10 while their test numbers were 84 / 70 / 32%. 30 halves that to ~5.5pp.
  n_val_episodes: 30
  # ABSOLUTE episode budget, from the top-level n_demos. Absolute rather than a fraction,
  # so it no longer moves when the test or val split sizes change -- which is exactly how
  # the budget silently fell 29 -> 25 when n_val_episodes went 10 -> 30. In the manifest's
  # derivation this truncates the permuted train pool, so budgets are nested: the
  # 25-episode set is a strict subset of the 100-episode one (verified in bc_prep.sbatch).
  n_train_episodes: ${n_demos}
  split: train
  # both must stay null with a split_file: they would re-subsample what the manifest
  # already pinned, and the dataset raises rather than apply one on top of the other.
  max_train_episodes: null
  train_ratio: null
