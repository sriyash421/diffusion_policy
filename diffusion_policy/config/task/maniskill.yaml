name: maniskill

shape_meta: &shape_meta
  obs:
    agent_state:
      shape: [24]
      type: low_dim
    base_pose:
      shape: [3]
      type: low_dim
    fetch_hand_rgb:
      shape: [3, 128, 128]
      type: rgb
    fetch_head_rgb:
      shape: [3, 128, 128]
      type: rgb
    state:
      shape: [42]
      type: low_dim
    tcp_pose:
      shape: [7]
      type: low_dim
  action:
    shape: [13]

task_name: &task_name maniskill

env_runner:
  _target_: diffusion_policy.env_runner.dummy_runner.DummyRunner

dataset:
  _target_: diffusion_policy.dataset.sim2real_image_dataset.Sim2RealImageMultiDataset
  # Option 1: Single dataset directory (backward compatible)
  # dataset_dir: ../OctiLab/datasets_test
  
  # Option 2: Multiple dataset directories with sampling ratios
  # dataset_config:
  #   - dataset_dir: ../OctiLab/datasets/0
  #     sampling_ratio: 0.9
  
  use_streaming: false
  samples_per_file_multiplier: 1.0
  shape_meta: *shape_meta
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.05
  use_cache: false
  use_disk: true
  return_sequences: true