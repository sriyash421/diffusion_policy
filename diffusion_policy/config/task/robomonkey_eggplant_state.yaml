name: robomonkey_eggplant_state

obs_keys: &obs_keys ['arm_joint_pos', 'end_effector_pose', 'joint_vel',
                     'last_arm_action', 'last_gripper_action',
                     'insertive_asset_pose', 'receptive_asset_pose']

# Sums to: 6 + 7 + 6 + 6 + 1 + 7 + 7 = 40
obs_dim: 40
action_dim: 7
keypoint_dim: 0

shape_meta: &shape_meta
  obs:
    arm_joint_pos:
      shape: [6]
      type: low_dim
    end_effector_pose:
      shape: [7]
      type: low_dim
    joint_vel:
      shape: [6]
      type: low_dim
    last_arm_action:
      shape: [6]
      type: low_dim
    last_gripper_action:
      shape: [1]
      type: low_dim
    insertive_asset_pose:
      shape: [7]
      type: low_dim
    receptive_asset_pose:
      shape: [7]
      type: low_dim
    # RGB only used by the verifier (not flattened into the policy obs)
    agentview_image:
      shape: [3, 224, 224]
      type: rgb
  action:
    shape: [7]

task_name: &task_name robomonkey_eggplant_state

env_runner:
  _target_: diffusion_policy.env_runner.dummy_runner.DummyRunner

dataset:
  _target_: diffusion_policy.dataset.sim2real_image_dataset.Sim2RealImageMultiDataset
  dataset_dir: /home/harine/data/eggplant_in_basket
  use_streaming: false
  samples_per_file_multiplier: 1.0
  shape_meta: *shape_meta
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.05
  use_cache: true
  use_disk: true
  # Train on successful trajectories only (terminal reward > 0).
  success_only: true
  success_reward_key: rewards
