# Outer/inner trainer, SUBGOAL-OBSERVATION feedback (1/3 of the search-context sweep).
#
# Identical to train_pusht_search_outer_inner except for what each already-generated
# candidate feeds back into the context the next candidate is conditioned on:
#   value          the verifier scalar (-mean keypoint distance to the goal T)
#   subgoal (here) the observation the candidate's action chunk actually REACHES in the
#                  PushT sim -- rendered frame plus agent_pos/feedback, pushed through this
#                  policy's own obs encoder. No scalar verdict at all, so the model has to
#                  read the outcome off the subgoal itself.
# Candidate *ranking* still uses the verifier scalar in every mode, so rollout/eval stays
# directly comparable across the three.
#
# NOTE the defaults order: `_self_` LAST so this file's values win over the parent's.
defaults:
  - train_pusht_search_outer_inner
  - _self_

name: train_pusht_search_outer_inner_subgoal

# Identity keys. `trainer` MUST be set: hydra.run.dir is
#   ${output_root}/${exp_name}/${task_name}/${trainer}/${run_name}
# so without it every outer/inner arm lands in the OFFLINE run's directory and,
# with training.resume: True, loads that run's checkpoints under a different
# workspace. search_context must be top-level for the same reason -- setting it
# under policy: left run_name reading ctx-value regardless of the real arm.
trainer: outer_inner
search_context: subgoal
corrupt_obs: False
arm: subgoal-chosen4value


logging:
  tags: ["${name}", "${task_name}", "${exp_name}", "outer_inner", "subgoal"]
